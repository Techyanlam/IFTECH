name: Copy Wanchang products to new table (one-off)

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy products from old table to new 產品 table
        env:
          WANCHANG_APP_ID: ${{ secrets.WANCHANG_APP_ID }}
          WANCHANG_APP_SECRET: ${{ secrets.WANCHANG_APP_SECRET }}
        run: python3 scripts/wanchang-copy-products.py
