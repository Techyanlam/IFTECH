name: Move ManCheong icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move icons to repo root and verify md5
        run: |
          git mv tmp-upload-icon/mancheong-icon-180.png mancheong-icon-180.png
          git mv tmp-upload-icon/mancheong-icon-512.png mancheong-icon-512.png
          md5sum mancheong-icon-180.png mancheong-icon-512.png
          test "$(md5sum mancheong-icon-180.png | cut -d' ' -f1)" = "cd0972e843049c292caaf4f0899f8f8c"
          test "$(md5sum mancheong-icon-512.png | cut -d' ' -f1)" = "8598332d0ae0f7d7afff158f51923b27"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Add ManCheong home-screen icons"
          git push
