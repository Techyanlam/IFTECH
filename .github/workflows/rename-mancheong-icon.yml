name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify md5 and replace root mancheong.html
        run: |
          set -e
          echo "md5 tmp-upload-mc7/mancheong.html:"
          md5sum tmp-upload-mc7/mancheong.html
          echo "27b8908cf4bd1625893c7f033a298f6b  tmp-upload-mc7/mancheong.html" | md5sum -c -
          rm -f mancheong.html
          git mv tmp-upload-mc7/mancheong.html mancheong.html
          echo "md5 root mancheong.html after rename:"
          md5sum mancheong.html
          echo "27b8908cf4bd1625893c7f033a298f6b  mancheong.html" | md5sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html (home-screen icon links)"
          git push
