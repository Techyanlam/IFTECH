name: Rename mancheong match

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, rename and push mancheong.html
        run: |
          set -e
          echo "Checking uploaded file md5..."
          md5sum tmp-upload-mc-match/mancheong.html
          [ "$(md5sum tmp-upload-mc-match/mancheong.html | awk '{print $1}')" = "489ab6ef62dde0a98cdafb051239ab2f" ]
          rm -f mancheong.html
          git mv tmp-upload-mc-match/mancheong.html mancheong.html
          echo "Checking renamed file md5..."
          md5sum mancheong.html
          [ "$(md5sum mancheong.html | awk '{print $1}')" = "489ab6ef62dde0a98cdafb051239ab2f" ]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Matcher skips blank-name products"
          git push || (git pull --rebase origin main && git push)
