name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify uploaded file and rename
        run: |
          set -e
          echo "tmp md5:"
          md5sum tmp-upload-mc/mancheong.html
          test "$(md5sum tmp-upload-mc/mancheong.html | cut -d' ' -f1)" = "612191753c6fb089c0406a0451cac4d8"
          rm -f mancheong.html
          git mv tmp-upload-mc/mancheong.html mancheong.html
          echo "root md5 after rename:"
          md5sum mancheong.html
          test "$(md5sum mancheong.html | cut -d' ' -f1)" = "612191753c6fb089c0406a0451cac4d8"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html (records auto-refresh 30s)" || echo "nothing to commit"
          git push
