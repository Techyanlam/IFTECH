name: Rename mancheong refresh (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify md5 and rename mancheong.html
        run: |
          set -e
          echo "Uploaded file md5:"
          md5sum tmp-upload-mc4/mancheong.html
          EXPECTED=ee6451b987d3ee9a8a1de001847d0d23
          ACTUAL=$(md5sum tmp-upload-mc4/mancheong.html | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "MD5 mismatch for uploaded file: $ACTUAL"; exit 1; fi
          rm -f mancheong.html
          git mv tmp-upload-mc4/mancheong.html mancheong.html
          echo "Root file md5 after rename:"
          md5sum mancheong.html
          ACTUAL2=$(md5sum mancheong.html | awk '{print $1}')
          if [ "$ACTUAL2" != "$EXPECTED" ]; then echo "MD5 mismatch after rename: $ACTUAL2"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html (stock page refresh button)" || echo "nothing to commit"
          git push
