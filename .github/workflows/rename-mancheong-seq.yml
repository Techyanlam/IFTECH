name: Rename mancheong (seq)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded mancheong.html to repo root
        run: |
          set -e
          echo "MD5 before rename:"
          md5sum tmp-upload-mc-seq/mancheong.html
          rm -f mancheong.html
          git mv tmp-upload-mc-seq/mancheong.html mancheong.html
          echo "MD5 after rename:"
          md5sum mancheong.html
          test "$(md5sum mancheong.html | awk '{print $1}')" = "1dc71cd05c655d77d43be14f607582cb"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Receipt sync writes split allocations sequentially"
          git push
