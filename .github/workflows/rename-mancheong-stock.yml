name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify md5 and rename to root
        run: |
          echo "md5 before rename (tmp):"
          md5sum tmp-upload-mc3/mancheong.html
          test "$(md5sum tmp-upload-mc3/mancheong.html | awk '{print $1}')" = "393344357c5508a85f13f082f819d40e"
          rm -f mancheong.html
          git mv tmp-upload-mc3/mancheong.html mancheong.html
          echo "md5 after rename (root):"
          md5sum mancheong.html
          test "$(md5sum mancheong.html | awk '{print $1}')" = "393344357c5508a85f13f082f819d40e"
          rmdir tmp-upload-mc3 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html (stock page reads Feishu 庫存 table)" || echo "nothing to commit"
          git push
