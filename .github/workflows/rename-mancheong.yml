name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mancheong.html with uploaded light-theme version
        run: |
          set -eux
          test -f tmp-mancheong-light-20261107/mancheong.html
          rm -f mancheong.html
          git mv tmp-mancheong-light-20261107/mancheong.html mancheong.html
          rmdir tmp-mancheong-light-20261107
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html with light-theme version"
          git push
