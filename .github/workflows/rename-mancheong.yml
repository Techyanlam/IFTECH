name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file into place
        run: |
          set -e
          test -f tmp-mancheong-sync-20261107/mancheong.html
          rm -f mancheong.html
          git mv tmp-mancheong-sync-20261107/mancheong.html mancheong.html
          rmdir tmp-mancheong-sync-20261107 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "ManCheong: replace mancheong.html with synced version (two-way Feishu sync + GR card hides warehoused rows)"
          git push
