name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file into place
        run: |
          test -f tmp-mancheong-noreminder-20261107/mancheong.html
          rm -f mancheong.html
          git mv tmp-mancheong-noreminder-20261107/mancheong.html mancheong.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html (remove backup reminder from confirm notices)" || echo "nothing to commit"
          git push
