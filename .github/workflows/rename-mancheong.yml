name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp file into place
        run: |
          test -f tmp-mancheong-hide-20261109/mancheong.html
          rm -f mancheong.html
          git mv tmp-mancheong-hide-20261109/mancheong.html mancheong.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html (hide backup section and GR assigned toggle)" || echo "nothing to commit"
          git push
