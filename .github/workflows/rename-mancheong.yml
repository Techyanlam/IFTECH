name: Rename mancheong

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp file over mancheong.html
        run: |
          rm -f mancheong.html
          git mv tmp-mancheong-20261107-0134/mancheong.html mancheong.html
          rm -rf tmp-mancheong-20261107-0134
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "ManCheong: auto-fill new product name from search text"
          git push
