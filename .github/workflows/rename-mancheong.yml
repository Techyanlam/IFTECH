name: Rename mancheong (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp file into place
        run: |
          test -f tmp-mancheong-clear-20261108/mancheong.html
          rm -f mancheong.html
          git mv tmp-mancheong-clear-20261108/mancheong.html mancheong.html
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace mancheong.html with cleared-records version"
          git push
