name: Rename mancheong temp upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp upload over mancheong.html
        run: |
          git config user.name "Techyanlam"
          git config user.email "techyanlam@users.noreply.github.com"
          git mv mancheong-temp-upload-20261106-215500/mancheong.html mancheong.html
          git add -A
          git commit -m "ManCheong: write back warehouse to Feishu on receipt confirm" || echo "nothing to commit"
          git push
