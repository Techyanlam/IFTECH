name: Rename mancheong temp file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp file over mancheong.html
        run: |
          rm -f mancheong.html
          git mv tmp-mancheong-ai-photo/mancheong.html mancheong.html
          rmdir tmp-mancheong-ai-photo
          ls -l mancheong.html
          git status --short
      - name: Commit and push
        run: |
          git config user.name "Techyanlam"
          git config user.email "Techyanlam@users.noreply.github.com"
          git add -A
          git commit -m "ManCheong: add AI拍照收貨 sidebar link to Feishu form" || echo "nothing to commit"
          git push
