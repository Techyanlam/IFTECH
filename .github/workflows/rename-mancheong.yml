name: Rename ManCheong temp upload
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp upload over mancheong.html
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f mancheong.html
          git mv mancheong-temp-upload-20261106-190100/mancheong.html mancheong.html
          git add -A
          git commit -m "ManCheong: add Feishu GR selector card to receiving page + product 5127" || echo "nothing to commit"
          git push
