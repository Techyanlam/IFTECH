name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace root mancheong.html with uploaded file
        run: |
          set -euo pipefail
          echo "Expected md5: 1ea214498069b32dd615154705044794"
          echo "Before rename (tmp-upload):"
          ls -l tmp-upload/mancheong.html
          md5sum tmp-upload/mancheong.html
          echo "Before rename (root, old):"
          ls -l mancheong.html
          md5sum mancheong.html || true
          test "$(md5sum tmp-upload/mancheong.html | awk '{print $1}')" = "1ea214498069b32dd615154705044794"
          rm -f mancheong.html
          git mv tmp-upload/mancheong.html mancheong.html
          echo "After rename (root, new):"
          ls -l mancheong.html
          md5sum mancheong.html
          test "$(md5sum mancheong.html | awk '{print $1}')" = "1ea214498069b32dd615154705044794"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace mancheong.html with updated version (5143 products)"
          git push
