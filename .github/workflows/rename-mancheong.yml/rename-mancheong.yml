name: Rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temp mancheong.html into place
        run: |
          test -f tmp-mancheong-theme-20261107/mancheong.html
          rm -f mancheong.html
          git mv tmp-mancheong-theme-20261107/mancheong.html mancheong.html
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace mancheong.html with blue/white theme version"
          git push
