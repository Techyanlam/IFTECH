name: Rename stock script (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace script and verify md5
        run: |
          set -e
          echo "Before:"
          md5sum scripts/wanchang-sync-stock.py || true
          echo "Tmp upload:"
          md5sum tmp-upload/wanchang-sync-stock.py
          rm -f scripts/wanchang-sync-stock.py
          git mv tmp-upload/wanchang-sync-stock.py scripts/wanchang-sync-stock.py
          echo "After rename:"
          md5sum scripts/wanchang-sync-stock.py
          test "$(md5sum scripts/wanchang-sync-stock.py | cut -d' ' -f1)" = "9bb198852078a1f43f1215c21cb0bfbc"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace scripts/wanchang-sync-stock.py with fixed version" || echo "nothing to commit"
          git push
