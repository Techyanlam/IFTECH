name: Rename stock script (one-off 3)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace scripts/wanchang-sync-stock.py with tmp-upload copy
        run: |
          set -euxo pipefail
          echo "Before:"
          md5sum tmp-upload/wanchang-sync-stock.py
          wc -l tmp-upload/wanchang-sync-stock.py
          ls -l scripts/wanchang-sync-stock.py tmp-upload/wanchang-sync-stock.py
          rm -f scripts/wanchang-sync-stock.py
          git mv tmp-upload/wanchang-sync-stock.py scripts/wanchang-sync-stock.py
          echo "After rename:"
          md5sum scripts/wanchang-sync-stock.py
          wc -l scripts/wanchang-sync-stock.py
          test "$(md5sum scripts/wanchang-sync-stock.py | cut -d' ' -f1)" = "45c40ab623ca53b06449a88347ce3884"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace scripts/wanchang-sync-stock.py with fixed version (tmp-upload)"
          git push
