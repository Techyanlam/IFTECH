name: Rename stock workflow (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file into .github/workflows
        run: |
          rm -f .github/workflows/sync_wanchang_stock.yml
          git mv tmp-upload-mc5/sync_wanchang_stock.yml .github/workflows/sync_wanchang_stock.yml
          echo "md5 after rename:"
          md5sum .github/workflows/sync_wanchang_stock.yml
          test "$(md5sum .github/workflows/sync_wanchang_stock.yml | cut -d' ' -f1)" = "29476144949f2b327194c96d0dd2fac3"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stock sync every 10 minutes" || echo "nothing to commit"
          git push
