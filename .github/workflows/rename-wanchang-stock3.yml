name: Rename Wanchang stock script (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify uploaded md5 and rename
        run: |
          set -e
          echo "Uploaded file md5:"
          md5sum tmp-upload-stock3/wanchang-sync-stock.py
          EXPECTED="779a9dee704f63f7473f10f7b84ab4fd"
          ACTUAL=$(md5sum tmp-upload-stock3/wanchang-sync-stock.py | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "md5 mismatch for uploaded file: $ACTUAL"; exit 1; fi
          rm -f scripts/wanchang-sync-stock.py
          git mv tmp-upload-stock3/wanchang-sync-stock.py scripts/wanchang-sync-stock.py
          echo "After rename md5:"
          md5sum scripts/wanchang-sync-stock.py
          ACTUAL2=$(md5sum scripts/wanchang-sync-stock.py | awk '{print $1}')
          if [ "$ACTUAL2" != "$EXPECTED" ]; then echo "md5 mismatch after rename: $ACTUAL2"; exit 1; fi
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Stock rebuild: parse Number qty + webpage-confirmed qty wins" || echo "nothing to commit"
          git push
