name: Rename wanchang stocksum upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded script into scripts/
        run: |
          git mv tmp-upload-stocksum/wanchang-sync-stock-summary.py scripts/wanchang-sync-stock-summary.py
          md5sum scripts/wanchang-sync-stock-summary.py
          ls -l scripts/wanchang-sync-stock-summary.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add pivoted stock summary rebuild (庫存總表)" || echo "nothing to commit"
          git push
