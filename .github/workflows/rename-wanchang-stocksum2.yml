name: Rename Wanchang stock summary (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded script into place
        run: |
          set -e
          ls -l tmp-upload-stocksum2/wanchang-sync-stock-summary.py
          echo "MD5 before rename:"
          md5sum tmp-upload-stocksum2/wanchang-sync-stock-summary.py
          rm -f scripts/wanchang-sync-stock-summary.py
          git mv tmp-upload-stocksum2/wanchang-sync-stock-summary.py scripts/wanchang-sync-stock-summary.py
          echo "MD5 after rename:"
          md5sum scripts/wanchang-sync-stock-summary.py
          test "$(md5sum scripts/wanchang-sync-stock-summary.py | awk '{print $1}')" = "9367fed36b90a249ca0126e2a4b64501"
          ls -l scripts/wanchang-sync-stock-summary.py
          rmdir tmp-upload-stocksum2 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Stock summary: merge same-part rows, delete duplicates" || echo "nothing to commit"
          git push
