name: Sync Wanchang stock (Feishu -> 庫存 table)

on:
  schedule:
    - cron: '15 18 * * *'   # 02:15 HKT daily

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild 庫存 table from movements
        env:
          WANCHANG_APP_ID: ${{ secrets.WANCHANG_APP_ID }}
          WANCHANG_APP_SECRET: ${{ secrets.WANCHANG_APP_SECRET }}
        run: python3 scripts/wanchang-sync-stock.py
