name: Temp rename batch2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace files via git mv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f mancheong.html scripts/wanchang-sync-stock-summary.py
          git mv temp-batch2-20261111/mancheong.html mancheong.html
          git mv temp-batch2-20261111/wanchang-sync-stock-summary.py scripts/wanchang-sync-stock-summary.py
          git commit -m "萬昌：收貨加名＋取消轉狀態＋庫存倉位 filter＋出貨編號改 DN＋暫存待確認"
          git push origin main || (git pull --rebase origin main && git push origin main)
