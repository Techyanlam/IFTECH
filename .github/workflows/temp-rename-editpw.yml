name: Temp rename mancheong (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mancheong.html with uploaded copy
        run: |
          set -e
          rm -f mancheong.html
          git mv temp-editpw-20261111/mancheong.html mancheong.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace mancheong.html with uploaded version (edit password gate)"
          git push origin main
