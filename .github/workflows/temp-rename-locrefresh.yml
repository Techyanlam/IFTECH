name: Temp rename locrefresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mancheong.html from temp folder
        run: |
          rm -f mancheong.html
          git mv temp-locrefresh-20261110/mancheong.html mancheong.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Locations 30s auto-refresh + sidebar title"
          git push origin main
