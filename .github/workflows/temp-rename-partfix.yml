name: Temp rename partfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mancheong.html from temp folder
        run: |
          rm -f mancheong.html
          git mv temp-partfix-20261110/mancheong.html mancheong.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "New product blank part falls back to name"
          git pull --rebase origin main
          git push
