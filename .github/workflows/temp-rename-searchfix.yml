name: Temp rename searchfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move uploaded file into place
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f mancheong.html
          git mv temp-searchfix-20261110/mancheong.html mancheong.html
          git commit -m "Search: no re-render while typing + multi-word search"
          git push origin main
