name: Temp rename stockcols

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mancheong.html from temp folder
        run: |
          rm -f mancheong.html
          git mv temp-stockcols-20261111/mancheong.html mancheong.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace mancheong.html: show only selected warehouse column on stock page"
          git push origin main
