<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BETTEREAT 訂購</title>
<meta name="theme-color" content="#c98a2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BETTEREAT 訂購">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif; background: #f6f4ef; color: #2b2620; padding-bottom: 110px; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 20px 16px 32px; }
  header.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 0; background: rgba(246,244,239,.96); border-bottom: 1px solid #e8e0d2; }
  header.top .brand { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header.top .brand span { color: #c98a2d; }
  header.top .cartbtn { font-size: 14px; color: #a06a14; border: 1px solid #c98a2d; background: #fdf8ef; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
  .meta { color: #8a7f70; font-size: 13px; margin: 14px 0; line-height: 1.6; }
  h2.sec { font-size: 16px; margin: 22px 0 10px; padding-left: 10px; border-left: 4px solid #c98a2d; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .controls input[type="text"] { flex: 1; min-width: 200px; padding: 9px 12px; font-size: 15px; border: 1px solid #d8cfc0; border-radius: 10px; background: #fff; }
  .note { background: #fdf8ef; border: 1px solid #e6d3ac; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #6d6152; margin-bottom: 14px; line-height: 1.7; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(60,45,20,.06); cursor: pointer; border: 2px solid transparent; }
  .card.incart { border-color: #c98a2d; }
  .card .imgwrap { position: relative; width: 100%; padding-top: 72%; background: #faf7f1; overflow: hidden; }
  .card .imgwrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .imgwrap .ph { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 52px; }
  .card .body { padding: 10px 12px 12px; }
  .card .name { font-size: 15px; font-weight: 700; line-height: 1.4; min-height: 42px; }
  .card .sub { font-size: 12px; color: #8a7f70; margin-top: 2px; }
  .card .step { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .card .step .add { flex: 1; padding: 9px; font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #d99a35, #b97a1e); border: none; border-radius: 10px; cursor: pointer; }
  .card .step .minus, .card .step .plus { width: 38px; height: 38px; font-size: 20px; font-weight: 700; color: #a06a14; background: #fdf8ef; border: 1px solid #c98a2d; border-radius: 10px; cursor: pointer; }
  .card .step .qty { font-size: 17px; font-weight: 700; min-width: 28px; text-align: center; }
  .summary { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(60,45,20,.06); }
  .summary textarea { width: 100%; min-height: 120px; padding: 10px; font-size: 14px; line-height: 1.7; border: 1px solid #d8cfc0; border-radius: 10px; background: #fdfbf7; resize: vertical; }
  .xbtn { padding: 10px 16px; font-size: 14px; border: 1px solid #c98a2d; color: #a06a14; background: #fdf8ef; border-radius: 10px; cursor: pointer; }
  .xbtn.primary { color: #fff; background: linear-gradient(135deg, #d99a35, #b97a1e); border: none; font-weight: 700; }
  .xbtn:disabled { opacity: .45; cursor: not-allowed; }
  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(43,38,32,.97); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cartbar .info { font-size: 15px; font-weight: 700; }
  .cartbar .info small { font-weight: 400; opacity: .75; }
  .cartbar .btns { display: flex; gap: 8px; }
  .cartbar button { padding: 10px 16px; font-size: 14px; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; }
  .cartbar .clear { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  .cartbar .copy { background: #fff; color: #2b2620; }
  .cartbar .go { background: linear-gradient(135deg, #d99a35, #b97a1e); color: #fff; }
  .cartbar button:disabled { opacity: .45; cursor: not-allowed; }
  .foot { color: #a2937f; font-size: 12px; margin-top: 16px; text-align: center; line-height: 1.8; }
  @media (max-width: 820px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } .cartbar { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">🍰 BETTEREAT <span>訂購</span></div>
    <button class="cartbtn" onclick="scrollToCart()">🛒 已選 <span id="cartCountTop">0</span> 件</button>
  </header>

  <div class="meta" id="metaLine">載入餐牌中…</div>

  <h2 class="sec">撳一下就加 1 件</h2>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="搜尋產品名稱／編號">
  </div>
  <div class="note">撳產品圖就加 1 件；已選嘅產品可以用 ＋／− 改數量。價錢由店員確認後報價，收款沿用連結方式。落單步驟：1）呢度揀好產品 2）撳「複製訂單」3）撳「去落單表單」，貼上訂單內容，填埋姓名、電話、取貨門店同日期，提交就得。</div>
  <div class="grid" id="grid"></div>

  <h2 class="sec" id="cartTitle">🛒 已選訂單</h2>
  <div class="summary">
    <textarea id="summaryBox" readonly placeholder="未揀任何產品"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
      <button class="xbtn" id="copyBtn" onclick="copyOrder()">📋 複製訂單</button>
      <button class="xbtn primary" id="goFormBtn">去落單表單 →</button>
      <button class="xbtn" onclick="clearCart()">清空</button>
    </div>
  </div>
  <div class="foot">數據來源：BETTEREAT 飛書系統 · 餐牌以最近有銷售記錄嘅產品為準<br>產品相片陸續補上，現時未有相片嘅產品會顯示圖示。</div>
</div>

<div class="cartbar">
  <div class="info"><span id="cartInfo">未揀任何產品</span></div>
  <div class="btns">
    <button class="clear" onclick="clearCart()">清空</button>
    <button class="copy" onclick="copyOrder()">📋 複製訂單</button>
    <button class="go" id="goFormBtnBar">去落單表單 →</button>
  </div>
</div>

<script>
var DATA_URL = "https://raw.githubusercontent.com/Techyanlam/BETTEREAT/main/bettereat_sold_data.json";
var FORM_URL = "FORM_URL_PLACEHOLDER";
var products = [], cart = {}, searchText = "";

function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function loadData(){
  fetch(DATA_URL + "?t=" + Date.now()).then(function(r){ return r.json(); }).then(function(j){
    var recs = j.records || [];
    if ((!recs || !recs.length) && j.history && j.date) recs = j.history[j.date] || [];
    var map = {}, order = [];
    recs.forEach(function(r){
      if (!map[r.product_code]) { map[r.product_code] = { code: r.product_code, name: r.product_name, unit: r.unit }; order.push(r.product_code); }
    });
    order.sort();
    products = order.map(function(c){ return map[c]; });
    document.getElementById("metaLine").textContent = "餐牌更新：" + j.date + " ｜ 共 " + products.length + " 款產品 ｜ 撳圖即加 1 件";
    renderGrid();
    updateCart();
  }).catch(function(){
    document.getElementById("metaLine").textContent = "暫時讀取唔到餐牌，請稍後重新整理。";
  });
}
function visibleProducts(){
  if (!searchText) return products;
  return products.filter(function(p){
    return (p.code + " " + p.name).toLowerCase().indexOf(searchText) >= 0;
  });
}
function renderGrid(){
  var vis = visibleProducts();
  var html = "";
  vis.forEach(function(p){
    var q = cart[p.code] || 0;
    var cls = q > 0 ? "card incart" : "card";
    var step = q > 0
      ? '<button class="minus" onclick="event.stopPropagation();removeItem(\'' + esc(p.code) + '\')">−</button><span class="qty">' + q + '</span><button class="plus" onclick="event.stopPropagation();addItem(\'' + esc(p.code) + '\')">＋</button>'
      : '<button class="add" onclick="event.stopPropagation();addItem(\'' + esc(p.code) + '\')">＋ 加 1 件</button>';
    html += '<div class="' + cls + '" onclick="addItem(\'' + esc(p.code) + '\')">' +
      '<div class="imgwrap"><img src="images/products/' + esc(p.code) + '.jpg" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="ph" style="display:none;">🍰</div></div>' +
      '<div class="body"><div class="name">' + esc(p.name) + '</div>' +
      '<div class="sub">' + esc(p.code) + ' · 單位：' + esc(p.unit) + '</div>' +
      '<div class="step">' + step + '</div></div></div>';
  });
  document.getElementById("grid").innerHTML = html || '<div style="color:#8a7f70;padding:20px;">冇符合條件嘅產品</div>';
}
function cartTotals(){
  var items = 0, kinds = 0;
  for (var c in cart) { if (cart[c] > 0) { items += cart[c]; kinds += 1; } }
  return { items: items, kinds: kinds };
}
function buildSummary(){
  var lines = [], items = 0;
  products.forEach(function(p){
    var q = cart[p.code] || 0;
    if (q > 0) { lines.push(p.code + " " + p.name + " x" + q + "（" + p.unit + "）"); items += q; }
  });
  if (!lines.length) return "";
  return "BETTEREAT 訂購\n" + lines.join("\n") + "\n共 " + items + " 件";
}
function updateCart(){
  var t = cartTotals();
  document.getElementById("cartCountTop").textContent = t.items;
  document.getElementById("cartInfo").innerHTML = t.items > 0
    ? "已選 " + t.items + " 件 · " + t.kinds + " 款 <small>（撳卡加 1 件，＋／− 改數量）</small>"
    : "未揀任何產品";
  document.getElementById("summaryBox").value = buildSummary();
  var ready = FORM_URL !== "FORM_URL_PLACEHOLDER" && FORM_URL.indexOf("http") === 0;
  var go1 = document.getElementById("goFormBtn"), go2 = document.getElementById("goFormBtnBar");
  if (ready) {
    go1.disabled = false; go1.textContent = "去落單表單 →";
    go2.disabled = false; go2.textContent = "去落單表單 →";
  } else {
    go1.disabled = true; go1.textContent = "落單表單準備緊";
    go2.disabled = true; go2.textContent = "落單表單準備緊";
  }
  renderGrid();
}
function addItem(code){
  cart[code] = (cart[code] || 0) + 1;
  updateCart();
}
function removeItem(code){
  cart[code] = (cart[code] || 0) - 1;
  if (cart[code] <= 0) delete cart[code];
  updateCart();
}
function clearCart(){
  cart = {};
  updateCart();
}
function copyOrder(){
  var text = buildSummary();
  if (!text) { alert("未揀任何產品"); return; }
  var box = document.getElementById("summaryBox");
  box.select();
  try { document.execCommand("copy"); } catch (e) {}
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function(){});
  }
  alert("訂單已複製，去落單表單貼上就得。");
}
function scrollToCart(){
  document.getElementById("cartTitle").scrollIntoView();
}
function goForm(){
  if (FORM_URL !== "FORM_URL_PLACEHOLDER" && FORM_URL.indexOf("http") === 0) {
    window.open(FORM_URL, "_blank");
  }
}
document.getElementById("searchInput").addEventListener("input", function(){
  searchText = this.value.trim().toLowerCase();
  renderGrid();
});
document.getElementById("goFormBtn").onclick = goForm;
document.getElementById("goFormBtnBar").onclick = goForm;
loadData();
</script>
</body>
</html>
