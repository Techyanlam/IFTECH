<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <link rel="apple-touch-icon" sizes="180x180" href="/mancheong-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="萬昌倉庫" />
    <title>ManCheong</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #eff6ff;
        --text: #1e293b;
        --dim: #5b6b82;
        --border: #d5dee9;
        --grid: #c3d2e4;
        --accent: #1d4ed8;
        --accent-ink: #ffffff;
        --accent-soft: #eff6ff;
        --accent-hover: #1e40af;
        --title: #0f2a4a;
        --sidebar: #0f2a4a;
        --sidebar-alt: #1b3a5f;
        --sidebar-text: #eaf2fb;
        --sidebar-dim: #a9c3e4;
        --bad: #b3261e;
        --bad-bg: #fbeae9;
        --ok: #1c6b3a;
        --ok-bg: #e6f4ea;
        --warn: #8a5a00;
        --warn-bg: #fdf1d7;
        --head: #1d4ed8;
        --head-ink: #ffffff;
        --radius: 12px;
        --shadow: 0 1px 3px rgba(15, 42, 74, .12);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      a { color: var(--accent); }

      .layout { display: flex; flex-direction: column; min-height: 100vh; }
      @media (min-width: 1025px) { .layout { flex-direction: row; } }

      nav.main-nav {
        background: var(--sidebar);
        color: var(--sidebar-text);
        padding: 10px 10px 12px;
        position: sticky; top: 0; z-index: 30;
      }
      @media (min-width: 1025px) {
        nav.main-nav { width: 216px; flex-shrink: 0; height: 100vh; padding: 18px 12px; display: flex; flex-direction: column; }
      }
      .brand { padding: 2px 6px 10px; }
      .brand .name { font-size: 26px; font-weight: 800; letter-spacing: .4px; color: #fff; line-height: 1.15; }
      .brand .sub { font-size: 13px; color: var(--sidebar-dim); margin-top: 2px; }
      @media (min-width: 1025px) { .brand { padding: 4px 8px 16px; } .brand .name { font-size: 30px; } }
      .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      @media (min-width: 1025px) { .nav-grid { display: flex; flex-direction: column; gap: 6px; } }
      .nav-btn {
        border: 0; border-radius: var(--radius);
        background: var(--sidebar-alt); color: var(--sidebar-text);
        padding: 10px 4px; font-size: 15px; font-weight: 700; text-align: center;
      }
      @media (min-width: 1025px) { .nav-btn { text-align: left; padding: 11px 14px; background: transparent; } }
      .nav-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
      .nav-btn:hover { background: rgba(255, 255, 255, .10); }
      .nav-btn[aria-pressed="true"]:hover { background: var(--accent-hover); }
      .nav-btn.nav-link { display: block; text-decoration: none; }
      .nav-tools { margin-top: 14px; border-top: 1px solid var(--sidebar-alt); padding-top: 12px; display: none; }
      @media (min-width: 1025px) { .nav-tools { display: none; margin-top: auto; } } /* 備份欄唔顯示（Yan 2026-11-09） */
      .nav-bottom { display: none; }
      @media (min-width: 1025px) { .nav-bottom { display: block; margin-top: auto; border-top: 1px solid var(--sidebar-alt); padding-top: 12px; } } /* 側欄底「更新」掣（Yan 2026-11-09） */
      .nav-tools .tlabel { font-size: 12px; color: var(--sidebar-dim); padding: 0 8px 6px; }
      .tool-btn {
        display: block; width: 100%; border: 1px solid var(--sidebar-alt); border-radius: var(--radius);
        background: transparent; color: var(--sidebar-text); padding: 8px 12px; margin-bottom: 6px;
        font-size: 14px; font-weight: 600; text-align: left;
      }
      .tool-btn:active { opacity: .75; }

      main { flex: 1; min-width: 0; width: 100%; max-width: 1060px; margin: 0 auto; padding: 16px 14px 48px; }
      @media (min-width: 1025px) { main { padding: 24px 28px 56px; } }
      h1.page-title { font-size: 24px; margin: 0 0 4px; color: var(--title); }
      .page-sub { color: var(--dim); font-size: 14px; margin: 0 0 16px; }
      h2 { font-size: 19px; margin: 22px 0 10px; color: var(--title); }
      h3 { font-size: 16px; margin: 14px 0 8px; color: var(--title); }

      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 16px; margin-bottom: 14px;
      }
      .notice { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 15px; display: none; }
      .notice.show { display: block; }
      .notice.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
      .notice.err { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }
      .notice.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
      .notice a { font-weight: 700; }

      label.flabel { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 5px; }
      label.flabel:first-child { margin-top: 0; }
      .input, select.input, textarea.input {
        width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); color: var(--text);
        padding: 11px 12px; font-size: 16px; outline: none;
      }
      .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29, 78, 216, .18); }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .row > * { flex: 1 1 140px; }
      .row .shrink { flex: 0 0 auto; }

      .btn {
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        border-radius: var(--radius); padding: 10px 16px; font-weight: 700; font-size: 15px;
      }
      .btn:active { opacity: .75; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      .btn.danger { color: var(--bad); border-color: var(--bad); }
      .btn.big { width: 100%; padding: 14px; font-size: 17px; margin-top: 16px; }
      .btn.small { padding: 6px 10px; font-size: 14px; }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

      .picker-results { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 6px; max-height: 264px; overflow: auto; background: var(--surface); }
      .picker-item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); padding: 10px 12px; }
      .picker-item:hover { background: var(--accent-soft); }
      .picker-item:last-child { border-bottom: 0; }
      .picker-item .pname { font-weight: 700; }
      .picker-item .pmeta { font-size: 13px; color: var(--dim); }
      .picker-item .fs-collapsed { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .picker-item .fs-detail { display: block; }
      .picker-item.selected { background: var(--accent-soft); }
      .picker-note { font-size: 13px; color: var(--dim); margin-top: 6px; }
      .selected-chip { display: none; margin-top: 8px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 9px 12px; font-size: 15px; }
      .selected-chip.show { display: block; }

      .alloc-row, .item-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-top: 10px; background: var(--surface); }
      .item-card { background: var(--surface-2); }
      .item-card .item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .item-head .t { font-weight: 800; color: var(--title); }
      .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); vertical-align: middle; }

      .table-wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--grid); border-radius: var(--radius); background: var(--surface); }
      table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14.5px; }
      table.grid th, table.grid td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 8px 10px; text-align: left; vertical-align: top; }
      table.grid th:last-child, table.grid td:last-child { border-right: 0; }
      table.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--head); color: var(--head-ink); font-weight: 700; white-space: nowrap; }
      table.grid tbody tr:nth-child(even) { background: var(--surface-2); }
      table.grid tbody tr:hover { background: var(--accent-soft); }
      table.grid tfoot td { font-weight: 800; background: var(--accent-soft); }
      td.num, th.num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
      td.date, td.time { white-space: nowrap; font-variant-numeric: tabular-nums; }
      .count-line { font-size: 14px; color: var(--dim); margin: 8px 0; }
      .quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .quick-row .btn { padding: 7px 12px; font-size: 14px; }

      .loc-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
      @media (min-width: 560px) { .loc-grid { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 900px) { .loc-grid { grid-template-columns: 1fr 1fr 1fr; } }
      .loc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
      .loc-card .lname { font-size: 20px; font-weight: 800; color: var(--title); }
      .loc-card .lkind { font-size: 13px; color: var(--dim); }
      .loc-card .lstat { margin: 8px 0 4px; font-size: 15px; }
      .loc-card .lstat b { font-size: 20px; }

      .modal-back { position: fixed; inset: 0; background: rgba(10, 25, 48, .55); z-index: 60; display: none; align-items: flex-end; justify-content: center; }
      @media (min-width: 760px) { .modal-back { align-items: center; } }
      .modal-back.show { display: flex; }
      .modal-box { background: var(--surface); color: var(--text); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 20px; }
      @media (min-width: 760px) { .modal-box { border-radius: 14px; } }
      .modal-box h3 { margin-top: 0; font-size: 18px; }
      /* 通知彈窗（取代行內橫幅）：文字＋一個「確認」掣 */
      .notice-back { z-index: 70; }
      .notice-back .modal-box { border-top: 4px solid var(--ok); }
      .notice-back.notice-err .modal-box { border-top-color: var(--bad); }
      .notice-back.notice-warn .modal-box { border-top-color: var(--warn); }
      #noticeText { font-size: 16px; line-height: 1.6; word-break: break-word; }
      #noticeText a { font-weight: 700; }
      /* 手機漢堡選單：窄屏先出 ☰，闊屏維持原有導覽格 */
      #btnMenu { display: none; }
      @media (max-width: 1024px) {
        .nav-grid { display: none; }
        .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 6px; }
        #btnMenu { display: block; border: 0; border-radius: var(--radius); background: var(--sidebar-alt); color: var(--sidebar-text); font-size: 22px; line-height: 1; padding: 8px 12px; }
      }
      .menu-back { position: fixed; inset: 0; background: rgba(10, 25, 48, .55); z-index: 55; display: none; }
      .menu-back.show { display: block; }
      .menu-panel { position: absolute; top: 0; left: 0; bottom: 0; width: min(300px, 85vw); background: var(--sidebar); color: var(--sidebar-text); padding: 14px 12px; overflow-y: auto; box-shadow: 2px 0 12px rgba(0, 0, 0, .4); }
      .menu-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px; }
      .menu-head span { font-size: 18px; font-weight: 800; color: #fff; }
      #btnMenuClose { border: 0; background: transparent; color: var(--sidebar-text); font-size: 20px; padding: 4px 8px; }
      .menu-panel .nav-btn { display: block; width: 100%; text-align: left; padding: 11px 14px; margin-bottom: 6px; }
      .diff-table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 10px 0; }
      .diff-table th, .diff-table td { border: 1px solid var(--grid); padding: 7px 9px; text-align: left; }
      .diff-table td.num { text-align: right; }
      .mobile-tools { display: none; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; } /* 備份欄唔顯示（Yan 2026-11-09） */
      @media (min-width: 760px) { .mobile-tools { display: none; } }
      .hidden { display: none !important; }
      .mt8 { margin-top: 8px; } .mt14 { margin-top: 14px; }
      .small { font-size: 13.5px; color: var(--dim); }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav class="main-nav" aria-label="主要功能">
        <div class="brand">
          <div>
            <div class="name">ManCheong</div>
            <div class="sub">萬昌倉庫管理</div>
          </div>
          <button type="button" id="btnMenu" aria-label="打開選單" aria-expanded="false">☰</button>
        </div>
        <div class="nav-grid" id="navGrid"></div>
        <div class="nav-tools">
          <div class="tlabel">資料備份（本機操作）</div>
          <button type="button" class="tool-btn" id="btnBackupSide">匯出備份 JSON</button>
          <button type="button" class="tool-btn" id="btnImportSide">匯入備份 JSON</button>
          <button type="button" class="tool-btn" id="btnResetSide">恢復內置資料</button>
        </div>
        <div class="nav-bottom">
          <button type="button" class="tool-btn" id="btnRefreshAll">更新</button>
        </div>
      </nav>
      <main>
        <div class="mobile-tools">
          <button type="button" class="btn small" id="btnBackupM">匯出備份</button>
          <button type="button" class="btn small" id="btnImportM">匯入備份</button>
          <button type="button" class="btn small" id="btnResetM">恢復內置資料</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" class="hidden" />
        <div class="notice" id="notice" role="status"></div>
        <div id="view"></div>
      </main>
    </div>

    <div class="modal-back" id="modalBack">
      <div class="modal-box" role="dialog" aria-modal="true">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <div class="btn-row">
          <button type="button" class="btn" id="modalCancel">取消</button>
          <button type="button" class="btn primary" id="modalOk">確認</button>
        </div>
      </div>
    </div>

    <div class="modal-back notice-back" id="noticeBack">
      <div class="modal-box" role="dialog" aria-modal="true">
        <div id="noticeText"></div>
        <div class="btn-row">
          <button type="button" class="btn primary" id="noticeOk">確認</button>
        </div>
      </div>
    </div>

    <div class="menu-back" id="menuBack">
      <div class="menu-panel">
        <div class="menu-head"><span>選單</span><button type="button" id="btnMenuClose" aria-label="關閉選單">✕</button></div>
        <div id="menuList"></div>
      </div>

    <script>
      "use strict";
      /* ============ 資料層（內置快照，可匯出／匯入備份） ============ */
      var SEED = JSON.parse(document.getElementById("seed").textContent);
      function normalizeData(d) {
        var out = {
          locations: (d.locations || []).map(function (l) {
            return Array.isArray(l)
              ? { id: l[0], name: l[1], kind: l[2] || null, sortOrder: l[3] || 0, fsId: l[4] || null }
              : { id: l.id, name: l.name, kind: l.kind || null, sortOrder: l.sortOrder || 0, fsId: l.fsId || null };
          }),
          products: (d.products || []).map(function (p) {
            return Array.isArray(p)
              ? { id: p[0], name: p[1], partNumber: p[2] || null, brand: p[3] || null, aliases: p[4] || null, unit: p[5] || "件", fsId: p[6] || null }
              : { id: p.id, name: p.name, partNumber: p.partNumber || null, brand: p.brand || null, aliases: p.aliases || null, unit: p.unit || "件", fsId: p.fsId || null };
          }),
          receipts: (d.receipts || []).map(function (r) {
            return {
              id: r.id, productId: r.productId, supplier: r.supplier || null,
              totalQty: r.totalQty, note: r.note || null, createdAt: r.createdAt,
              photo: r.photo || null,
              ai: r.ai || null
            };
          }),
          allocations: (d.allocations || []).map(function (a) {
            return Array.isArray(a)
              ? { receiptId: a[0], location: a[1], qty: a[2] }
              : { receiptId: a.receiptId, location: a.location, qty: a.qty };
          }),
          transfers: (d.transfers || []).map(function (t) {
            return Array.isArray(t)
              ? { id: t[0], productId: t[1], fromLocation: t[2], toLocation: t[3], qty: t[4], note: t[5] || null, createdAt: t[6] }
              : { id: t.id, productId: t.productId, fromLocation: t.fromLocation, toLocation: t.toLocation, qty: t.qty, note: t.note || null, createdAt: t.createdAt };
          }),
          shipments: (d.shipments || []).map(function (s) {
            return Array.isArray(s)
              ? { id: s[0], productId: s[1], fromLocation: s[2], qty: s[3], shipmentNumber: s[4] || null, note: s[5] || null, createdAt: s[6] }
              : { id: s.id, productId: s.productId, fromLocation: s.fromLocation, qty: s.qty, shipmentNumber: s.shipmentNumber || null, note: s.note || null, createdAt: s.createdAt };
          })
        };
        out.locations.sort(function (a, b) { return a.sortOrder - b.sortOrder || a.id - b.id; });
        return out;
      }
      var DB = normalizeData(JSON.parse(JSON.stringify(SEED)));
      var productMap = {};
      function rebuildMaps() {
        productMap = {};
        DB.products.forEach(function (p) { productMap[p.id] = p; });
      }
      rebuildMaps();
      function nextId(rows) {
        var m = 0;
        rows.forEach(function (r) { if (r.id > m) m = r.id; });
        return m + 1;
      }
      function locationNames() { return DB.locations.map(function (l) { return l.name; }); }

      /* ============ 工具 ============ */
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function fmtQty(n) {
        if (n == null || isNaN(n)) return "";
        return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
      }
      var dtfDate = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit" });
      var dtfTime = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Hong_Kong", hour: "2-digit", minute: "2-digit", hour12: false });
      function fmtDate(ts) { return dtfDate.format(new Date(ts)); }
      function fmtTime(ts) { return dtfTime.format(new Date(ts)); }
      function todayStr() { return fmtDate(Date.now()); }
      function datePlus(days) { return fmtDate(Date.now() + days * 86400000); }
      function productLabel(p) {
        return p.name + (p.partNumber ? "（" + p.partNumber + "）" : "");
      }
      function searchText(p) {
        return [p.name, p.partNumber || "", p.brand || "", p.aliases || ""].join(" ").toLowerCase();
      }
      function findProducts(query, limit) {
        var q = (query || "").trim().toLowerCase();
        var out = [];
        for (var i = 0; i < DB.products.length; i++) {
          var p = DB.products[i];
          if (!q || searchText(p).indexOf(q) !== -1) {
            out.push(p);
            if (out.length >= (limit || 100)) break;
          }
        }
        return out;
      }
      function countProducts(query) {
        var q = (query || "").trim().toLowerCase();
        if (!q) return DB.products.length;
        var n = 0;
        DB.products.forEach(function (p) { if (searchText(p).indexOf(q) !== -1) n++; });
        return n;
      }
      function normalizeKey(s) { return String(s || "").trim().toLowerCase().replace(/[\s\-_/]/g, ""); }
      function matchProduct(item) {
        if (item.partNumber) {
          var key = normalizeKey(item.partNumber);
          if (key) {
            for (var i = 0; i < DB.products.length; i++) {
              var p = DB.products[i];
              if (p.partNumber && normalizeKey(p.partNumber) === key) return p.id;
            }
          }
        }
        var name = (item.productName || "").trim();
        if (!name) return null;
        var exact = DB.products.filter(function (p) { return p.name === name; });
        if (exact.length === 1) return exact[0].id;
        var lower = name.toLowerCase();
        var aliasExact = DB.products.filter(function (p) { return p.aliases && p.aliases.trim().toLowerCase() === lower; });
        if (aliasExact.length === 1) return aliasExact[0].id;
        var contains = DB.products.filter(function (p) {
          // 名空白嘅產品唔可以參加包含比對：空字串係任何字串嘅子字串，
          // 否則 TA328（主檔商品名稱空白）會配對到任何新產品（Oronine 就係咁）。
          var pn = (p.name || "").trim();
          if (pn && (pn.indexOf(name) !== -1 || name.indexOf(pn) !== -1)) return true;
          var a = p.aliases ? p.aliases.trim().toLowerCase() : "";
          return a !== "" && (a.indexOf(lower) !== -1 || lower.indexOf(a) !== -1);
        });
        return contains.length === 1 ? contains[0].id : null;
      }

      /* ============ 庫存計算 ============ */
      function computeStock() {
        var stock = new Map();
        function add(pid, loc, delta) {
          var m = stock.get(pid);
          if (!m) { m = new Map(); stock.set(pid, m); }
          m.set(loc, (m.get(loc) || 0) + delta);
        }
        var receiptProduct = {};
        DB.receipts.forEach(function (r) { receiptProduct[r.id] = r.productId; });
        DB.allocations.forEach(function (a) {
          var pid = receiptProduct[a.receiptId];
          if (pid != null) add(pid, a.location, a.qty);
        });
        DB.transfers.forEach(function (t) { add(t.productId, t.fromLocation, -t.qty); add(t.productId, t.toLocation, t.qty); });
        DB.shipments.forEach(function (s) { add(s.productId, s.fromLocation, -s.qty); });
        return stock;
      }
      function stockAt(stock, pid, loc) {
        var m = stock.get(pid);
        return m ? (m.get(loc) || 0) : 0;
      }
      function totalStock(stock, pid) {
        var m = stock.get(pid), t = 0;
        if (m) m.forEach(function (v) { t += v; });
        return t;
      }
      function locationStats(stock) {
        var stats = {};
        locationNames().forEach(function (n) { stats[n] = { kinds: 0, qty: 0 }; });
        stock.forEach(function (m) {
          m.forEach(function (v, loc) {
            if (!stats[loc]) stats[loc] = { kinds: 0, qty: 0 };
            if (Math.abs(v) > 1e-9) { stats[loc].kinds++; stats[loc].qty += v; }
          });
        });
        return stats;
      }

      /* ============ 通知／彈窗／下載 ============ */
      var noticeEl = document.getElementById("notice");
      var noticeBack = document.getElementById("noticeBack");
      var noticeTextEl = document.getElementById("noticeText");
      function setNotice(msg, type, linkHtml) {
        noticeTextEl.innerHTML = esc(msg) + (linkHtml ? " " + linkHtml : "");
        noticeBack.classList.remove("notice-ok", "notice-err", "notice-warn");
        noticeBack.classList.add("notice-" + (type || "ok"));
        noticeBack.classList.add("show");
      }
      function hideNotice() { noticeBack.classList.remove("show"); }
      document.getElementById("noticeOk").addEventListener("click", hideNotice);
      function clearNotice() { noticeEl.className = "notice"; noticeEl.innerHTML = ""; hideNotice(); }
      var modalOkHandler = null;
      function showModal(title, bodyHtml, okLabel, onOk) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").innerHTML = bodyHtml;
        document.getElementById("modalOk").textContent = okLabel || "確認";
        modalOkHandler = onOk;
        document.getElementById("modalBack").classList.add("show");
      }
      function hideModal() { document.getElementById("modalBack").classList.remove("show"); modalOkHandler = null; }
      document.getElementById("modalCancel").addEventListener("click", hideModal);
      document.getElementById("modalOk").addEventListener("click", function () {
        var h = modalOkHandler; hideModal(); if (h) h();
      });
      function downloadBlob(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        return url;
      }
      function downloadLink(url, filename, label) {
        return '<a href="' + url + '" download="' + esc(filename) + '">' + esc(label) + "</a>";
      }

    <script>

      /* ============ 手機漢堡選單 ============ */

        menuBack.classList.remove("show");

      }
      btnMenu.addEventListener("click", function () {
        if (menuBack.classList.contains("show")) closeMenu(); else openMenu();
      });
      document.getElementById("btnMenuClose").addEventListener("click", closeMenu);
      menuBack.addEventListener("click", function (e) { if (e.target === menuBack) closeMenu(); });
      menuList.addEventListener("click", function (e) {
        var b = e.target.closest("[data-tab]");
        if (b) { tab = b.getAttribute("data-tab"); render(); closeMenu(); return; }
        if (e.target.closest("#btnRefreshMenu")) { refreshCurrent(); closeMenu(); return; }
        if (e.target.closest("a")) closeMenu();
      });

      /* ============ 側欄底「更新」掣：即刻由飛書重攞而家呢頁嘅數據 ============ */
      function refreshCurrent() {
        // 跳過各頁嘅 cache，即刻重攞；唔使等 30 秒自動更新或者撳每頁自己嘅更新掣。
        if (tab === "receive") { fsRcvFetch(); }
        else if (tab === "receipts" || tab === "transfers" || tab === "shipments") { fsSyncFetch(tab, true); }
        else if (tab === "stock" || tab === "transfer" || tab === "ship") { fsStockCache = null; fsStockFetch(true); }
        else if (tab === "locations") { fsLocCacheAt = 0; fsLocFetch(); }
        render();
      }
      document.getElementById("btnRefreshAll").addEventListener("click", refreshCurrent);
      var view = document.getElementById("view");
      function render() {
        if (tab !== "receive" && fsAutoTimer) { clearInterval(fsAutoTimer); fsAutoTimer = null; }

        else if (tab === "locations") renderLocations();

      /* ============ 產品搜尋選擇器 ============ */
      // container 元素會得到：input.picker-search、div.picker-results、div.selected-chip

            return DB.products.filter(function (p) { return stockAt(opts.stock, p.id, opts.onlyStockedAt) > 0; });
          }
          return null; // null = 用 findProducts 直接查全主檔

      /* ============ 飛書記錄雙向同步（網頁記錄 ↔ 飛書同步表） ============ */
      // 三張同步表（Worker 按 kind 分流）：收貨 網頁收貨記錄、轉位 網頁轉位記錄、出貨 網頁出貨記錄。
      // 寫入：確認收貨／轉位／出貨嗰陣，每項一行 POST /sync-record（best-effort，唔會阻住本地儲存）。
      // 讀取：記錄頁開嗰陣 GET /synced-records?kind=…，同本地記錄合併顯示；本地已有嘅（syncId 相同）唔會重複。
      var FS_SYNC_BASE = "https://man-cheong-feishu-sync.yan-lam.workers.dev";

      var fsSyncFailed = { receipts: false, transfers: false, shipments: false };
      var fsSyncFailedAt = { receipts: 0, transfers: 0, shipments: 0 }; // 上次攞唔到嘅時間，30 秒內唔重試
      function newSyncId() { return "W" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
      function fsSyncPost(body) {
        var controller = null, timeoutId = null;
        var opts = { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
        if (window.AbortController) {
          controller = new AbortController();
          opts.signal = controller.signal;
          timeoutId = setTimeout(function () { try { controller.abort(); } catch (e) {} }, 60000);
        }
        return fetch(FS_SYNC_BASE + "/sync-record", opts).then(function (resp) {
          return resp.json().catch(function () { return null; }).then(function (data) {
            return { ok: resp.ok, data: data };
          });
        }).then(function (r) {
          if (timeoutId) clearTimeout(timeoutId);
          if (!r.ok || !r.data || r.data.error || r.data.ok === false) return false;
          return true;
        }).catch(function () { if (timeoutId) clearTimeout(timeoutId); return false; });
      }
      // 倉位雙向同步：飛書 倉庫主檔 <-> 本地位置清單。
      // fsId = 飛書 record_id（備份 JSON 會一齊存返，restore 嗰陣經 normalizeData 保留）。
      var fsLocCacheAt = 0;
      var fsLocPromise = null;
      function fsLocPost(body) {
        // POST /location-write；成功就傳回 Worker 嘅 data（帶 record_id），失敗就 false。
        var controller = null, timeoutId = null;
        var opts = { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
        if (window.AbortController) {
          controller = new AbortController();
          opts.signal = controller.signal;
          timeoutId = setTimeout(function () { try { controller.abort(); } catch (e) {} }, 60000);
        }
        return fetch(FS_SYNC_BASE + "/location-write", opts).then(function (resp) {
          return resp.json().catch(function () { return null; }).then(function (data) {
            return { ok: resp.ok, data: data };
          });
        }).then(function (r) {
          if (timeoutId) clearTimeout(timeoutId);
          if (!r.ok || !r.data || r.data.error || r.data.ok === false) return false;
          return r.data;
        }).catch(function () { if (timeoutId) clearTimeout(timeoutId); return false; });
      }
      function fsLocFetch() {
        // GET /locations，合併入 DB.locations；有變動就傳回 true。
        // 5 分鐘內唔重複攞。飛書嗰邊空晒就當攞唔到，唔好誤刪本地位置。
        if (Date.now() - fsLocCacheAt < 300000) return Promise.resolve(false);
        if (fsLocPromise) return fsLocPromise;
        fsLocPromise = fetch(FS_SYNC_BASE + "/locations").then(function (resp) {
          return resp.json().catch(function () { return null; });
        }).then(function (data) {
          if (!data || !Array.isArray(data.locations) || data.locations.length === 0) return false;
          fsLocCacheAt = Date.now();
          var changed = false;

          showModal("數量同標示唔同，請再確認",
            "<p>以下貨品嘅確認入倉數量同相片／包裝標示數量唔同：</p>" +
            '<table class="diff-table"><thead><tr><th>產品</th><th>標示數量</th><th>確認數量</th><th>相差</th></tr></thead><tbody>' + rows + "</tbody></table>" +
            "<p>確認無誤先好照儲存。</p>",
            "確認無誤，照儲存",
            function () { commitReceive(items); });

        }

      }

      /* ============ 轉位 ============ */

      /* ============ 記錄三頁（Excel 式格仔表＋日期篩選＋Export CSV） ============ */
      var recFilters = {
        receipts: { q: "", from: "", to: "" },
        transfers: { q: "", from: "", to: "" },
        shipments: { q: "", from: "", to: "" }
      };
      function movementRows(kind) {
        var rows = [];
        if (kind === "receipts") {
          var allocByReceipt = {};
          DB.allocations.forEach(function (a) {
            (allocByReceipt[a.receiptId] = allocByReceipt[a.receiptId] || []).push(a);
          });
          DB.receipts.forEach(function (r) {
            var p = productMap[r.productId] || { name: "(產品已刪)", partNumber: null, unit: "件" };
            var allocs = (allocByReceipt[r.id] || []).map(function (a) { return a.location + " " + fmtQty(a.qty); }).join("；");
            var grNo = r.srcGr || ("GR-" + r.id);
            rows.push({
              id: r.id, ts: r.createdAt, product: p, qty: r.totalQty,
              cells: [grNo, fmtDate(r.createdAt), fmtTime(r.createdAt), p.name, p.partNumber || "", fmtQty(r.totalQty), p.unit, allocs, r.supplier || "", r.note || "", r.photo ? "有" : ""],
              photo: r.photo,
              search: [grNo, p.name, p.partNumber || "", r.supplier || "", allocs].join(" ").toLowerCase()
            });
          });
        } else if (kind === "transfers") {
          DB.transfers.forEach(function (t) {
            var p = productMap[t.productId] || { name: "(產品已刪)", partNumber: null, unit: "件" };
            rows.push({
              id: t.id, ts: t.createdAt, product: p, qty: t.qty,
              cells: ["TR-" + t.id, fmtDate(t.createdAt), fmtTime(t.createdAt), p.name, p.partNumber || "", fmtQty(t.qty), p.unit, t.fromLocation, t.toLocation, t.note || ""],
              search: ["TR-" + t.id, p.name, p.partNumber || "", t.fromLocation, t.toLocation].join(" ").toLowerCase()
            });
          });
        } else {
          DB.shipments.forEach(function (s) {
            var p = productMap[s.productId] || { name: "(產品已刪)", partNumber: null, unit: "件" };
            rows.push({
              id: s.id, ts: s.createdAt, product: p, qty: s.qty,
              cells: ["SH-" + s.id, s.shipmentNumber || "", fmtDate(s.createdAt), fmtTime(s.createdAt), p.name, p.partNumber || "", fmtQty(s.qty), p.unit, s.fromLocation, s.note || ""],
              search: ["SH-" + s.id, s.shipmentNumber || "", p.name, p.partNumber || "", s.fromLocation].join(" ").toLowerCase()
            });
          });
        }
        rows.push.apply(rows, fsSyncRows(kind));
        rows.sort(function (a, b) { return b.ts - a.ts || b.id - a.id; });
        return rows;
      }
      var RECORD_DEFS = {
        receipts: { title: "收貨記錄", headers: ["GR 編號", "日期", "時間", "產品", "型號", "數量", "單位", "入倉明細", "供應商", "備註", "相片"], qtyIdx: 5, photoIdx: 10, file: "收貨記錄" },
        transfers: { title: "轉位記錄", headers: ["編號", "日期", "時間", "產品", "型號", "數量", "單位", "轉出位置", "轉入位置", "備註"], qtyIdx: 5, photoIdx: -1, file: "轉位記錄" },
        shipments: { title: "出貨記錄", headers: ["編號", "出貨單號", "日期", "時間", "產品", "型號", "數量", "單位", "出貨位置", "備註"], qtyIdx: 6, photoIdx: -1, file: "出貨記錄" }
      };
      function filteredRows(kind) {
        var f = recFilters[kind];
        var q = f.q.trim().toLowerCase();
        return movementRows(kind).filter(function (r) {
          var d = fmtDate(r.ts);
          if (f.from && d < f.from) return false;
          if (f.to && d > f.to) return false;
          if (q && r.search.indexOf(q) === -1) return false;
          return true;
        });
      }
      function renderRecords(kind) {
        var def = RECORD_DEFS[kind];
        var f = recFilters[kind];
        fsSyncFetch(kind); // 攞飛書同步記錄（30 秒內有 cache 就唔重攞）；本地記錄即刻顯示先
        if (fsRecTimer) clearInterval(fsRecTimer);
        fsRecTimer = setInterval(function () {
          if (tab !== kind) { clearInterval(fsRecTimer); fsRecTimer = null; return; }
          fsSyncFetch(kind); // 每 30 秒攞一次，唔同機器收到貨會自動出現，唔使撳重新整理
        }, 30 * 1000);
        var all = movementRows(kind);
        var shown = filteredRows(kind);
        var totalQty = shown.reduce(function (s, r) { return s + r.qty; }, 0);
        var dateErr = f.from && f.to && f.from > f.to;
        var fsFailNote = (fsSyncFailed[kind] && !fsSyncCache[kind]) ? '<p class="small" style="color:var(--bad)">未能載入飛書記錄，只顯示本機記錄。</p>' : "";
        var body = shown.map(function (r) {
          var tds = r.cells.map(function (c, i) {
            if (i === def.qtyIdx) return '<td class="num">' + esc(c) + "</td>";
            if (i === 1 || (kind === "shipments" && i === 2)) return '<td class="date">' + esc(c) + "</td>";
            if (i === 2 || (kind === "shipments" && i === 3)) return '<td class="time">' + esc(c) + "</td>";
            if (i === def.photoIdx) {
              if (r.photo) return '<td><a href="' + esc(r.photo) + '" target="_blank" rel="noopener"><img class="thumb" src="' + esc(r.photo) + '" alt="收貨相片" /></a></td>';
              return "<td></td>";
            }
            return "<td>" + esc(c) + "</td>";
          }).join("");
          return "<tr>" + tds + "</tr>";
        }).join("");
        view.innerHTML =
          '<h1 class="page-title">' + def.title + "</h1>" +
          '<p class="page-sub">顯示 ' + shown.length + " 筆（共 " + all.length + " 筆）</p>" + fsFailNote +
          '<div class="card">' +
          '<label class="flabel">搜尋</label><input type="text" class="input" id="recQ" value="' + esc(f.q) + '" placeholder="產品／型號／編號' + (kind === "shipments" ? "／出貨單號" : kind === "receipts" ? "／GR 編號／供應商" : "／位置") + '" />' +
          '<div class="row"><div><label class="flabel">由日期</label><input type="date" class="input" id="recFrom" value="' + esc(f.from) + '" /></div>' +
          '<div><label class="flabel">至日期</label><input type="date" class="input" id="recTo" value="' + esc(f.to) + '" /></div></div>' +
          (dateErr ? '<p class="small" style="color:var(--bad)">「由日期」遲過「至日期」，所以無記錄顯示。</p>' : "") +
          '<div class="quick-row">' +
          '<button type="button" class="btn" data-quick="today">今日</button>' +
          '<button type="button" class="btn" data-quick="7">近 7 日</button>' +
          '<button type="button" class="btn" data-quick="30">近 30 日</button>' +
          '<button type="button" class="btn" data-quick="clear">清除日期</button>' +
          '<button type="button" class="btn primary" id="btnCsv" ' + (shown.length ? "" : "disabled") + ">Export CSV</button></div>" +
          '<div class="mt8" id="csvReady"></div>' +
          "</div>" +
          (shown.length ?
            '<div class="table-wrap"><table class="grid"><thead><tr>' +
            def.headers.map(function (h, i) { return '<th' + (i === def.qtyIdx ? ' class="num"' : "") + ">" + esc(h) + "</th>"; }).join("") +
            "</tr></thead><tbody>" + body + "</tbody>" +
            '<tfoot><tr>' + def.headers.map(function (h, i) {
              if (i === 0) return "<td>合共</td>";
              if (i === def.qtyIdx) return '<td class="num">' + fmtQty(totalQty) + "</td>";
              return "<td></td>";
            }).join("") + "</tr></tfoot></table></div>"
            : '<div class="card">呢個篩選下無記錄。</div>');
        function applyAndRender() {
          recFilters[kind].q = document.getElementById("recQ").value;
          recFilters[kind].from = document.getElementById("recFrom").value;
          recFilters[kind].to = document.getElementById("recTo").value;
          render();
        }
        var qInput = document.getElementById("recQ");
        qInput.addEventListener("input", function () {
          recFilters[kind].q = qInput.value;
          render();
          var nq = document.getElementById("recQ");
          nq.focus();
          nq.setSelectionRange(nq.value.length, nq.value.length);
        });
        document.getElementById("recFrom").addEventListener("change", applyAndRender);
        document.getElementById("recTo").addEventListener("change", applyAndRender);
        view.querySelectorAll("[data-quick]").forEach(function (b) {
          b.addEventListener("click", function () {
            var k = b.getAttribute("data-quick");
            if (k === "today") { recFilters[kind].from = todayStr(); recFilters[kind].to = todayStr(); }
            else if (k === "7") { recFilters[kind].from = datePlus(-6); recFilters[kind].to = todayStr(); }
            else if (k === "30") { recFilters[kind].from = datePlus(-29); recFilters[kind].to = todayStr(); }
            else { recFilters[kind].from = ""; recFilters[kind].to = ""; }
            render();
          });
        });
        var csvBtn = document.getElementById("btnCsv");
        if (csvBtn) csvBtn.addEventListener("click", function () { exportCsv(kind, shown); });
      }
      function csvEscape(v) {
        var s = String(v == null ? "" : v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }
      function exportCsv(kind, rows) {
        var def = RECORD_DEFS[kind];
        var f = recFilters[kind];
        var lines = [def.headers.map(csvEscape).join(",")];
        rows.forEach(function (r) { lines.push(r.cells.map(csvEscape).join(",")); });
        var total = rows.reduce(function (s, r) { return s + r.qty; }, 0);
        var totalRow = def.headers.map(function (h, i) {
          if (i === 0) return "合共";
          if (i === def.qtyIdx) return total;
          return "";
        });
        lines.push(totalRow.map(csvEscape).join(","));
        var text = "﻿" + lines.join("\r\n") + "\r\n";
        var blob = new Blob([text], { type: "text/csv; charset=utf-8" });
        var suffix = (f.from || f.to) ? "_" + (f.from || "起") + "_" + (f.to || "止") : "_" + todayStr().replace(/-/g, "");
        var filename = def.file + suffix + ".csv";
        var url = downloadBlob(blob, filename);
        document.getElementById("csvReady").innerHTML =
          "CSV 已準備好（" + rows.length + ' 筆）：' + downloadLink(url, filename, "撳呢度下載 " + filename);
        setNotice("CSV 已匯出：" + filename + "（" + rows.length + " 筆）。如果未自動下載，撳記錄頁上面嘅下載連結。");
      }

      /* ============ 庫存 ============ */
      /* ============ 飛書庫存（庫存頁讀飛書「庫存總表」） ============ */
      // 庫存頁唔再只計本機記錄（reload／換機之後本機記錄係空，全部顯示 0）：
      // 佢攞飛書「庫存總表」（一行一款產品，每倉一欄；每 10 分鐘重建，
      // 收貨嗰陣即時重建），等唔同機器、reload 之後都睇到同一份庫存。
      // 攞唔到就用返本機記錄，並出提示。
      var fsStockCache = null; // {at, rows}
      var fsStockFetching = false;
      var fsStockFailed = false;
      var fsStockFailedAt = 0; // 上次攞唔到嘅時間，30 秒內唔重試
      var fsStockTimer = null; // 庫存頁自動更新（每 30 秒攞一次）
      // 將飛書庫存總表（fsStockCache.rows，一行一款，key 係貨品編號）轉做
      // 同 computeStock() 一樣格式嘅 Map（key 係產品 id），等轉位／出貨嗰啲
      // picker 可以直接用。攞唔到飛書庫存就返 null（用返本機記錄）。
      function fsStockMap() {
        if (!fsStockCache || !fsStockCache.rows) return null;
        var m = new Map();
        fsStockCache.rows.forEach(function (r) {
          var part = (r.part || "").trim();
          if (!part) return;
          var p = DB.products.find(function (x) { return (x.partNumber || "").trim() === part; });
          if (!p) return;
          var locs = new Map();
          var wh = r.warehouses || {};
          Object.keys(wh).forEach(function (name) { locs.set(name, +wh[name] || 0); });
          m.set(p.id, locs);
        });
        return m;
      }
      // 轉位／出貨用嘅庫存：有飛書庫存就用飛書（全部機器、全部記錄），
      // 冇（攞唔到／未載入）就用返本機記錄。
      function effectiveStock() {
        var fs = fsStockMap();
        return fs || computeStock();
      }
      function fsStockFetch(force) {
        var cached = fsStockCache;
        if (!force && cached && Date.now() - cached.at < 30 * 1000) return; // 30 秒 cache（撳「更新」嗰陣 force 會跳過）
        if (fsStockFetching) return;
        if (!force && fsStockFailed && Date.now() - fsStockFailedAt < 30000) return; // 攞唔到就等 30 秒先再試，唔好不停重攞
        fsStockFetching = true;
        fetch(FS_SYNC_BASE + "/stock-summary").then(function (resp) {
          return resp.json().catch(function () { return null; }).then(function (data) {
            return { ok: resp.ok, data: data };
          });
        }).then(function (r) {
          fsStockFetching = false;
          if (!r.ok || !r.data || r.data.error || !Array.isArray(r.data.rows)) {
            var wasFailed = fsStockFailed;
            fsStockFailed = true;
            fsStockFailedAt = Date.now();
            // 只喺第一次失敗嗰陣重畫（等「未能載入」嗰句出現）；之後再失敗唔重畫，
            // 否則重畫會再觸發 fsStockFetch，變成無限重試。
            if ((tab === "stock" || tab === "transfer" || tab === "ship") && !wasFailed) fsStockRerender();
            return;
          }
          fsStockFailed = false;
          fsStockCache = { at: Date.now(), rows: r.data.rows };
          if (tab === "stock" || tab === "transfer" || tab === "ship") fsStockRerender();
        }).catch(function () {
          fsStockFetching = false;
          var wasFailed2 = fsStockFailed;
          fsStockFailed = true;
          fsStockFailedAt = Date.now();

        if (fsStockCache && fsStockCache.rows) {
          // 飛書庫存總表：一行一款產品，每倉一欄（倉1–倉7、收貨區、出貨區），
          // 另有收貨總數、出貨總數、總庫存。
          var all = fsStockCache.rows.map(function (r) {
            var part = (r.part || "").trim();
            var p = DB.products.find(function (x) { return (x.partNumber || "").trim() === part; });
            var locs = {};
            names.forEach(function (n) { locs[n] = (r.warehouses && +r.warehouses[n]) || 0; });
            return {
              name: (r.name || "").trim() || (p ? p.name : part),

              total: +r.total || 0,
              inTotal: +r.in_total || 0,
              outTotal: +r.out_total || 0,
              moved: (+r.in_total || 0) !== 0 || (+r.out_total || 0) !== 0
            };
          });
          rows = all.filter(function (r) {
            if (stockState.onlyStocked && Math.abs(r.total) < 1e-9 && !r.moved) return false;
            if (q && r.search.indexOf(q) === -1) return false;
            return true;
          });
          locTotals = {};
          names.forEach(function (n) { locTotals[n] = 0; });
          all.forEach(function (r) {
            names.forEach(function (n) { if (r.locs[n] != null) locTotals[n] += r.locs[n]; });
          });
          grand = names.reduce(function (s, n) { return s + locTotals[n]; }, 0);
          inGrand = all.reduce(function (s, r) { return s + r.inTotal; }, 0);
          outGrand = all.reduce(function (s, r) { return s + r.outTotal; }, 0);
        } else {
          // 未攞到飛書庫存（第一次載入／攞唔到）：用返本機記錄。
          var stock = computeStock();
          var allLocal = DB.products.map(function (p) {
            var locs = {};
            names.forEach(function (n) { locs[n] = stockAt(stock, p.id, n); });
            return {
              name: p.name,
              partNumber: p.partNumber || "",
              brand: p.brand || "",
              search: searchText(p),
              locs: locs,
              total: totalStock(stock, p.id),
              inTotal: 0,
              outTotal: 0,
              moved: hasAnyStock(stock, p.id)
            };
          });
          rows = allLocal.filter(function (r) {
            if (stockState.onlyStocked && Math.abs(r.total) < 1e-9 && !r.moved) return false;
            if (q && r.search.indexOf(q) === -1) return false;
            return true;
          });
          locTotals = {};
          names.forEach(function (n) { locTotals[n] = 0; });
          allLocal.forEach(function (r) {
            names.forEach(function (n) { if (r.locs[n] != null) locTotals[n] += r.locs[n]; });

            '<th class="num">收貨總數</th><th class="num">出貨總數</th><th class="num">總數</th></tr></thead><tbody>' +
            shownRows.map(function (r) {

            setNotice("已新增產品：" + name + "。");
            fsProductSave(np).then(function (r) {
              if (r && r.ok) { if (r.record_id) np.fsId = r.record_id; setNotice("已新增產品：" + name + "。已同步去飛書商品信息表。"); }
              else setNotice("已新增產品：" + name + "。但寫入飛書商品信息表失敗，請喺飛書手動補返。", "warn");
            });
          }
          rebuildMaps();
          render();
        });
        var ce = document.getElementById("btnCancelEdit");
        if (ce) ce.addEventListener("click", function () { prodState.editingId = null; render(); });
        var pq = document.getElementById("prodQ");
        pq.addEventListener("input", function () {
          prodState.q = pq.value; prodState.limit = 100; render();
          var nq = document.getElementById("prodQ"); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length);
        });
        view.querySelectorAll("[data-edit-product]").forEach(function (b) {
          b.addEventListener("click", function () {
            prodState.editingId = parseInt(b.getAttribute("data-edit-product"), 10);
            render(); window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });
        var pm = document.getElementById("prodMore");
        if (pm) pm.addEventListener("click", function () { prodState.limit += 100; render(); });
      }

      /* ============ 備份匯出／匯入／恢復 ============ */
      function exportData() {
        return {
          app: "ManCheong", version: 1, exportedAt: new Date().toISOString(),
          locations: DB.locations, products: DB.products, receipts: DB.receipts,
          allocations: DB.allocations, transfers: DB.transfers, shipments: DB.shipments
        };
      }
      function doBackup() {
        var blob = new Blob([JSON.stringify(exportData(), null, 1)], { type: "application/json" });
        var filename = "ManCheong-backup-" + todayStr() + ".json";
        var url = downloadBlob(blob, filename);
        setNotice("備份已匯出：" + filename + "。之後開返呢個檔案，用「匯入備份」就可以攞返晒所有資料。", "ok",
          downloadLink(url, filename, "未自動下載就撳呢度"));
      }
      function doImportClick() { document.getElementById("importFile").click(); }
      document.getElementById("importFile").addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var data = JSON.parse(reader.result);
            if (!data.products || !data.locations) throw new Error("bad");
            DB = normalizeData(data);
            rebuildMaps();
            locDetail = null; prodState.editingId = null;
            setNotice("備份已匯入：產品 " + DB.products.length + " 款、收貨 " + DB.receipts.length + " 筆、轉位 " + DB.transfers.length + " 筆、出貨 " + DB.shipments.length + " 筆。");
            render();
          } catch (err) {
            setNotice("匯入失敗：個檔案唔係 ManCheong 備份 JSON，或者內容損壞。", "err");
          }
          e.target.value = "";
        };
        reader.readAsText(f);
      });
      function doReset() {
        showModal("恢復內置資料", "<p>會將資料恢復做呢個獨立版內置嗰份（2026-11-06 快照：5,126 款產品、17 筆收貨、3 筆轉位），今次開頁之後做過嘅更改會無晒。確定？</p>", "確定恢復", function () {
          DB = normalizeData(JSON.parse(JSON.stringify(SEED)));
          rebuildMaps();
          locDetail = null; prodState.editingId = null;
          setNotice("已恢復內置資料。");
          render();
        });
      }
      ["btnBackupSide", "btnBackupM"].forEach(function (id) { document.getElementById(id).addEventListener("click", doBackup); });
      ["btnImportSide", "btnImportM"].forEach(function (id) { document.getElementById(id).addEventListener("click", doImportClick); });
      ["btnResetSide", "btnResetM"].forEach(function (id) { document.getElementById(id).addEventListener("click", doReset); });

      render();
      // 開頁嗰陣靜靜攞一次飛書倉位，合併入位置清單（之後轉頁就見到）；
      // 本地有、飛書未有嘅位置就補寫去飛書。
      fsLocFetch().then(function () { fsLocSyncLocal(); });
</script>
</body>
</html>
